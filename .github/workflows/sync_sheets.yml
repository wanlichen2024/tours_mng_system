name: Sync Google Sheets to Supabase

on:
  schedule:
    - cron: '*/15 21-23 * * 1-5'   # UTC 21-23 = 新西兰 10-13（夏令时）或 9-12（冬令时）
    - cron: '*/15 0-5 * * 2-6'     # UTC 0-5 = 新西兰 13-18（夏令时）或 12-17（冬令时）
  workflow_dispatch:          # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install gspread pandas supabase google-auth

      - name: Run sync script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          SHEET_URL: ${{ secrets.SHEET_URL }}
        run: python sync_sheets.py